<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click the Button!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="top-banner-ad">
        <p>Top Banner Ad</p>
    </div>
    <div id="clouds">
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
    </div>

    <div id="main-container">
        <div id="highscore-container">
            <h2>High Scores</h2>
            <div class="tabs">
                <button class="tab-button active" data-tab="daily">Daily</button>
                <button class="tab-button" data-tab="weekly">Weekly</button>
                <button class="tab-button" data-tab="monthly">Monthly</button>
            </div>
            <div class="tab-content">
                <div id="daily" class="tab-pane active">
                    <table id="highscore-table-daily">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Name</th>
                                <th>Score</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Daily high scores will be populated here by JS -->
                        </tbody>
                    </table>
                </div>
                <div id="weekly" class="tab-pane">
                    <table id="highscore-table-weekly">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Name</th>
                                <th>Score</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Weekly high scores will be populated here by JS -->
                        </tbody>
                    </table>
                </div>
                <div id="monthly" class="tab-pane">
                    <table id="highscore-table-monthly">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Name</th>
                                <th>Score</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Monthly high scores will be populated here by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="game-container">
            <div id="username-container">
                <input type="text" id="username-input" placeholder="Enter your name">
                <button id="save-username-button">Save</button>
                <button id="register-button">Register</button>
                <button id="change-emoji-button">Change Emoji</button>
            </div>
            <h1>Click the Button!</h1>
            <p>Click the button as many times as you can in 10 seconds.</p>
            <button id="click-button">🚀</button>
            <div id="stats">
                <p>Time Left: <span id="timer">10</span></p>
                <p>Score: <span id="score">0</span></p>
            </div>
            <button id="reset-button">Reset</button>
        </div>
    </div>

    <div id="ad-placeholder">
        <p>Ad Placeholder</p>
    </div>

    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Register</h2>
            <form id="register-form">
                <label for="reg-username">Username:</label>
                <input type="text" id="reg-username" name="username" required>
                <label for="reg-password">Password:</label>
                <input type="password" id="reg-password" name="password" required>
                <label for="reg-confirm-password">Confirm Password:</label>
                <input type="password" id="reg-confirm-password" name="confirm_password" required>
                <button type="submit">Register</button>
            </form>
        </div>
    </div>

    <div id="emoji-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Choose your Emoji</h2>
            <div id="emoji-selection">
                <span class="emoji">🚀</span>
                <span class="emoji">🛸</span>
                <span class="emoji">👽</span>
                <span class="emoji">👾</span>
                <span class="emoji">🤖</span>
                <span class="emoji">⭐</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
